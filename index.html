        <a class="repo-link" href="https://github.com/socoo123/english_speaking_improve" target="_blank" rel="noopener noreferrer">GitHub<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
